<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Kafe Terdekat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
    .cafe-list {
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Side Menu -->
      <div class="col-md-3 cafe-list bg-light p-3">
        <h4 class="mb-3">Daftar Kafe</h4>
        <div class="search-section mb-3">
          <button class="btn btn-primary w-100 mb-2" id="currentLocationButton">Gunakan Lokasi Saya</button>
          <div class="input-group">
            <input type="text" class="form-control" id="locationInput" placeholder="Masukkan lokasi (contoh: Jakarta)" />
            <button class="btn btn-primary" id="searchButton">Cari</button>
          </div>
        </div>
        <ul id="cafeList" class="list-group">
          <!-- Daftar kafe akan muncul di sini -->
        </ul>
      </div>

      <!-- Map Section -->
      <div class="col-md-9">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
