version: '3.8'
services:
  web:
    build: .
    ports:
      - "8082:80"
    volumes:
      - ./src:/var/www/html:cached
      - ./public:/var/www/html/public
      - ./images:/var/www/html/images
    depends_on:
      - db
  db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: komputasi_awan
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./tubesweb.sql:/docker-entrypoint-initdb.d/init.sql:ro
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: 123456
    depends_on:
      - db

volumes:
  db_data:
